<!doctype html>
<meta charset="utf-8">
<!-- Share-image template, rendered to public/og-*.png by scripts/brand-assets.mjs (?v=home or ?v=gta). Built from the app's own tokens. -->
<style>
@font-face{font-family:SG;src:url('../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2');font-weight:300 700}
@font-face{font-family:IN;src:url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#08110e;color:#f1fbf3;font-family:IN,sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(900px 520px at 88% 8%,#12493a 0%,transparent 70%),radial-gradient(700px 420px at 0% 110%,#3f7a1244 0%,transparent 70%)}
.brand{position:absolute;left:72px;top:60px;display:flex;align-items:center;gap:18px;font:700 44px SG;letter-spacing:-.02em}
.mark{width:42px;height:60px;border-radius:12px;background:#c6f432;border:4px solid #5d7d0c;display:grid;place-items:center}
.mark i{display:block;border-left:18px solid #0a1407;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:4px}
h1{position:absolute;left:72px;top:190px;width:640px;font:700 76px/0.98 SG;letter-spacing:-.025em;text-transform:uppercase}
h1 b{display:inline-block;background:#c6f432;color:#0a1407;border:4px solid #5d7d0c;border-radius:18px;padding:0 18px 6px;margin:6px 0;transform:rotate(-2deg);box-shadow:0 8px 0 #5d7d0c;font-weight:700}
.sub{position:absolute;left:72px;bottom:64px;display:flex;gap:12px}
.sub span{font:600 20px IN;color:#a8bfb2;border:2px solid #214037;background:#0f1b17;border-radius:999px;padding:8px 18px}
.stack{position:absolute;right:64px;top:44px;width:390px}
.card{display:flex;gap:18px;align-items:center;background:#0f1b17;border:2px solid #214037;border-radius:30px;padding:14px 18px;margin-bottom:16px;box-shadow:0 24px 50px -24px #000}
.card.first{border-color:#c6f432}
.ph{width:78px;height:128px;border-radius:20px;border:6px solid #030605;background:linear-gradient(160deg,#12493a,#0c1915 60%,#3f7a12);flex:none;position:relative}
.ph:after{content:'';position:absolute;left:10px;right:10px;bottom:12px;height:11px;border-radius:8px;background:#f1fbf3dd}
.rank{font:700 38px SG;color:#c6f432;-webkit-text-stroke:1px #5d7d0c}
.bars{flex:1;display:flex;flex-direction:column;gap:9px;margin-top:4px;width:200px}
.bars i{display:block;height:12px;border-radius:8px;background:#16261f;position:relative;overflow:hidden}
.bars i:after{content:'';position:absolute;inset:0;width:var(--w);background:linear-gradient(90deg,#34e5d3,#c6f432)}
</style>
<div class="glow"></div>
<div class="brand"><span class="mark"><i></i></span>reelio</div>
<h1 id="h"></h1>
<div class="sub" id="sub"></div>
<div class="stack">
  <div class="card first"><div class="ph"></div><div><div class="rank">#1</div><div class="bars"><i style="--w:92%"></i><i style="--w:78%"></i><i style="--w:85%"></i><i style="--w:64%"></i></div></div></div>
  <div class="card"><div class="ph"></div><div><div class="rank">#2</div><div class="bars"><i style="--w:70%"></i><i style="--w:88%"></i><i style="--w:52%"></i><i style="--w:75%"></i></div></div></div>
  <div class="card" style="margin:0"><div class="ph"></div><div><div class="rank">#3</div><div class="bars"><i style="--w:60%"></i><i style="--w:55%"></i><i style="--w:80%"></i><i style="--w:48%"></i></div></div></div>
</div>
<script>
const v=new URLSearchParams(location.search).get('v');
document.getElementById('h').innerHTML = v==='gta'
  ? 'GTA 6<br><b>clip maker</b><br>for gameplay'
  : 'Long video in.<br><b>Shorts</b> out.';
document.getElementById('sub').innerHTML = (v==='gta'
  ? ['Ranked 9:16 clips','Captions','Nothing uploaded']
  : ['In your browser','Captions + facecam','Free, no account']).map(t=>`<span>${t}</span>`).join('');
</script>
